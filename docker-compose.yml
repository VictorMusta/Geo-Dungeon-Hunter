services:
  mongodb:
    image: mongo:latest
    container_name: dungeons-db
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  mongo-express:
    image: mongo-express:latest
    container_name: dungeons-mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongodb

  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: dungeons-swagger
    restart: always
    ports:
      - "8082:8080"
    environment:
      SWAGGER_JSON: /docs/openapi.yaml
    volumes:
      - ./doc/openapi.yaml:/docs/openapi.yaml

volumes:
  mongodb_data:
